# Configuración del publicador de ofertas de Mercado Libre -> Telegram

mercado_libre:
  site_id: MLM  # México
  min_discount_pct: 20        # % mínimo de descuento (price vs original_price) para considerarse "oferta"
  top_total: 8                # tope total de ofertas a publicar por corrida

  # Sin uso actualmente: el descubrimiento de ofertas ahora es por scraping de
  # mercadolibre.com.mx/ofertas (src/ml_scraper.py), que no filtra por categoría.
  # Se dejan estos valores por si en algún momento se retoma la búsqueda vía API.
  categories:
    - Electrónica, Audio y Video
    - Celulares y Telefonía
    - Hogar, Muebles y Jardín
    - Deportes y Fitness
    - Ropa, Bolsas y Calzado
    - Computación
  items_per_category: 30
  top_per_category: 3

telegram:
  parse_mode: HTML

publishing:
  dedupe_window_days: 7       # no repetir el mismo item_id dentro de esta ventana
  posted_items_file: posted_items.json
