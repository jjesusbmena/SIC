# Configuración del publicador de ofertas de Mercado Libre -> Telegram

mercado_libre:
  site_id: MLM  # México
  # Nombres de categorías tal como aparecen en /sites/MLM/categories.
  # El sistema resuelve el category_id real en tiempo de ejecución (no se hardcodean IDs).
  categories:
    - Electrónica, Audio y Video
    - Celulares y Teléfonos
    - Hogar, Muebles y Jardín
    - Deportes y Fitness
    - Ropa, Zapatos y Accesorios
    - Computación
  items_per_category: 30      # cuántos items trae la búsqueda por categoría antes de filtrar
  min_discount_pct: 20        # % mínimo de descuento (price vs original_price) para considerarse "oferta"
  top_per_category: 3         # cuántas ofertas top se seleccionan por categoría
  top_total: 8                # tope total de ofertas a publicar por corrida

telegram:
  parse_mode: HTML

publishing:
  dedupe_window_days: 7       # no repetir el mismo item_id dentro de esta ventana
  posted_items_file: posted_items.json
