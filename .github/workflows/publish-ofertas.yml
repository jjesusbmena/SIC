name: Publicar ofertas de Mercado Libre en Telegram

on:
  schedule:
    - cron: "0 */6 * * *"  # cada 6 horas (hora UTC)
  workflow_dispatch: {}     # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write  # necesario para commitear posted_items.json (control de duplicados)

concurrency:
  group: publish-ofertas
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Preparar credenciales
        env:
          ML_STORAGE_STATE_B64: ${{ secrets.ML_STORAGE_STATE_B64 }}
        run: |
          cat > .env <<EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          ML_SITE_ID=MLM
          # OAuth de ML sin uso actualmente (ver src/config.py) - opcionales, no rompe si están vacíos
          ML_CLIENT_ID=${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET=${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN=${{ secrets.ML_REFRESH_TOKEN }}
          GH_PAT_SECRETS=${{ secrets.GH_PAT_SECRETS }}
          EOF
          echo "$ML_STORAGE_STATE_B64" | base64 -d > storage_state.json

      - name: Publicar ofertas
        run: python -m src.main

      - name: Guardar control de duplicados (posted_items.json)
        run: |
          if ! git diff --quiet -- posted_items.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add posted_items.json
            git commit -m "chore: actualiza posted_items.json [skip ci]"
            git push
          else
            echo "Sin cambios en posted_items.json"
          fi
